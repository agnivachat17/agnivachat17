     <text x="1136" y="184" font-family='"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="11.5" fill="#8A8E98" letter-spacing="2.4" text-anchor="end">SCANNING</text>
</svg>
