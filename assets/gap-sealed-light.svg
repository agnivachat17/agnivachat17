     </rect>
     <text x="64" y="56" font-family='"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="13" fill="#2C7BA8" letter-spacing="3.4" >NO PUBLIC RECORD</text>
     <text x="64" y="116" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="58" fill="#12151E" font-weight="300" >39 MONTHS</text>
