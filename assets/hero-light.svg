<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img"
     aria-label="The displacement map. BUILT runs along the top in amber, PUSHED along the bottom in sky blue. The gesture car sits alone at October 2022, built before anything else, dropping a short tether to January 2023 when its code was uploaded. Then the record stops: a vermilion arc spans thirty-nine months of complete silence across an empty chart before the pushes resume in May 2026.">

  <!--
        THE DISPLACEMENT MAP

        amber      built     · the private act, the part with a person in it
        sky        pushed    · the public record, machine-verified, indifferent
        vermilion  silence   · thirty-nine months in which git was told nothing

        every claim on this chart is checkable with `git log`.
        the arc is the only thing spanning the gap, and it is the point.
  -->

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F7F5F0"/>
      <stop offset="1" stop-color="#EFEBE2"/>
    </linearGradient>

    <linearGradient id="builtRail" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="1140" y2="0">
      <stop offset="0"    stop-color="#C77A14" stop-opacity="0.45"/>
      <stop offset="0.09" stop-color="#C77A14" stop-opacity="1"/>
      <stop offset="0.30" stop-color="#C77A14" stop-opacity="0.11"/>
      <stop offset="0.72" stop-color="#C77A14" stop-opacity="0.11"/>
      <stop offset="0.90" stop-color="#C77A14" stop-opacity="1"/>
      <stop offset="1"    stop-color="#C77A14" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="pushedRail" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="1140" y2="0">
      <stop offset="0"    stop-color="#2C7BA8" stop-opacity="0.3"/>
      <stop offset="0.09" stop-color="#2C7BA8" stop-opacity="1"/>
      <stop offset="0.30" stop-color="#2C7BA8" stop-opacity="0.14"/>
      <stop offset="0.72" stop-color="#2C7BA8" stop-opacity="0.14"/>
      <stop offset="0.90" stop-color="#2C7BA8" stop-opacity="1"/>
      <stop offset="1"    stop-color="#2C7BA8" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="normal" gradientUnits="userSpaceOnUse" x1="0" y1="270" x2="0" y2="450">
      <stop offset="0" stop-color="#C77A14" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2C7BA8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="carT" gradientUnits="userSpaceOnUse" x1="150" y1="270" x2="205" y2="450">
      <stop offset="0" stop-color="#C77A14"/>
      <stop offset="1" stop-color="#E8621F"/>
    </linearGradient>

    <linearGradient id="ignite" gradientUnits="userSpaceOnUse" x1="237" y1="0" x2="1039" y2="0">
      <stop offset="0"    stop-color="#C77A14"/>
      <stop offset="0.25" stop-color="#E8621F"/>
      <stop offset="0.7"  stop-color="#DC3A18"/>
      <stop offset="1"    stop-color="#D92B12"/>
    </linearGradient>

    <linearGradient id="voidband" gradientUnits="userSpaceOnUse" x1="240" y1="0" x2="1030" y2="0">
      <stop offset="0"   stop-color="#2C7BA8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2C7BA8" stop-opacity="0.11"/>
      <stop offset="1"   stop-color="#2C7BA8" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowHot" x="-20%" y="-120%" width="140%" height="340%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="silence" d="M 237 450 Q 638 300 1039 450"/>

    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .hi   { fill: #12151E; }
      .dim  { fill: #6B7180; }
      .amb  { fill: #C77A14; }
      .sky  { fill: #2C7BA8; }
      .ver  { fill: #D92B12; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="url(#ground)"/>

  <!-- ── masthead ─────────────────────────────────────────── -->
  <line x1="48" y1="52" x2="1152" y2="52" stroke="#DDD9D0"/>
  <text class="mono dim" x="48" y="80" font-size="14" letter-spacing="4.5">AGNIVA CHATTERJEE</text>
  <text class="mono dim" x="1152" y="80" font-size="12" letter-spacing="2.5" text-anchor="end">KOLKATA · 22.57°N 88.36°E</text>

  <text class="sans hi" x="48" y="152" font-size="62" font-weight="300" letter-spacing="0.5"
        textLength="722" lengthAdjust="spacingAndGlyphs">THE UNPUSHED YEARS</text>
  <text class="mono dim" x="48" y="186" font-size="13" letter-spacing="3.2"
        textLength="512" lengthAdjust="spacingAndGlyphs">GIT RECORDS WHEN YOU PUSHED · NEVER WHEN YOU BUILT</text>

  <rect x="240" y="272" width="790" height="176" fill="url(#voidband)"/>

  <!-- ── time axis ────────────────────────────────────────── -->
  <g stroke="#E4E0D7">
    <line x1="213" y1="228" x2="213" y2="492"/>
    <line x1="466" y1="228" x2="466" y2="492"/>
    <line x1="719" y1="228" x2="719" y2="492"/>
    <line x1="971" y1="228" x2="971" y2="492"/>
  </g>
  <g class="mono" fill="#8A8E98" font-size="11" letter-spacing="2" text-anchor="middle">
    <text x="213" y="516">2023</text><text x="466" y="516">2024</text>
    <text x="719" y="516">2025</text><text x="971" y="516">2026</text>
  </g>

  <!-- ── rails ────────────────────────────────────────────── -->
  <text class="mono amb" x="48" y="266" font-size="12" letter-spacing="3.5">BUILT</text>
  <text class="mono sky" x="48" y="446" font-size="12" letter-spacing="3.5">PUSHED</text>

  <g stroke-dasharray="990" stroke-dashoffset="0" fill="none">
    <animate attributeName="stroke-dashoffset" values="990;990;0" keyTimes="0;0.0833;1" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1"/>
    <line x1="150" y1="270" x2="1140" y2="270" stroke="url(#builtRail)" stroke-width="9" stroke-opacity="0.22"/>
    <line x1="150" y1="270" x2="1140" y2="270" stroke="url(#builtRail)" stroke-width="2.25"/>
  </g>
  <g stroke-dasharray="990" stroke-dashoffset="0" fill="none">
    <animate attributeName="stroke-dashoffset" values="990;990;0" keyTimes="0;0.2414;1" dur="1.45s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1"/>
    <line x1="150" y1="450" x2="1140" y2="450" stroke="url(#pushedRail)" stroke-width="9" stroke-opacity="0.22"/>
    <line x1="150" y1="450" x2="1140" y2="450" stroke="url(#pushedRail)" stroke-width="2.25"/>
  </g>

  <!-- ── objects whose record is accurate ─────────────────── -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6316;1" dur="1.9s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1"/>
    <g stroke="url(#normal)" stroke-width="1.6" stroke-opacity="0.85">
      <line x1="213" y1="270" x2="213" y2="450"/><line x1="221" y1="270" x2="221" y2="450"/>
      <line x1="229" y1="270" x2="229" y2="450"/><line x1="237" y1="270" x2="237" y2="450"/>
      <line x1="1039" y1="270" x2="1039" y2="450"/><line x1="1047" y1="270" x2="1047" y2="450"/>
      <line x1="1055" y1="270" x2="1055" y2="450"/><line x1="1068" y1="270" x2="1068" y2="450"/>
      <line x1="1090" y1="270" x2="1090" y2="450"/><line x1="1112" y1="270" x2="1112" y2="450"/>
    </g>
    <g class="amb" filter="url(#glowSoft)">
      <circle cx="213" cy="270" r="3.4"/><circle cx="221" cy="270" r="3.4"/>
      <circle cx="229" cy="270" r="3.4"/><circle cx="237" cy="270" r="3.4"/>
      <circle cx="1039" cy="270" r="3.4"/><circle cx="1047" cy="270" r="3.4"/>
      <circle cx="1055" cy="270" r="3.4"/><circle cx="1068" cy="270" r="3.4"/>
      <circle cx="1090" cy="270" r="3.4"/><circle cx="1112" cy="270" r="3.4"/>
    </g>
    <g class="sky" filter="url(#glowSoft)">
      <circle cx="213" cy="450" r="3.4"/><circle cx="221" cy="450" r="3.4"/>
      <circle cx="229" cy="450" r="3.4"/><circle cx="237" cy="450" r="3.4"/>
      <circle cx="1039" cy="450" r="3.4"/><circle cx="1047" cy="450" r="3.4"/>
      <circle cx="1055" cy="450" r="3.4"/><circle cx="1068" cy="450" r="3.4"/>
      <circle cx="1090" cy="450" r="3.4"/><circle cx="1112" cy="450" r="3.4"/>
    </g>
    <text class="mono" fill="#7A7F8C" x="225" y="546" font-size="10" letter-spacing="2.2" text-anchor="middle">JAN 2023 · 4 REPOS</text>
    <text class="mono" fill="#7A7F8C" x="1076" y="546" font-size="10" letter-spacing="2.2" text-anchor="middle">MAY—AUG 2026 · 6 REPOS</text>
  </g>

  <!-- ── the car: built october 2022, uploaded january 2023 ── -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7727;1" dur="2.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1"/>
    <circle cx="150" cy="270" r="6.5" class="amb" filter="url(#glowSoft)"/>
    <circle cx="150" cy="270" r="13" fill="none" stroke="#C77A14" stroke-width="1.1" stroke-opacity="0.55">
      <animate attributeName="r" values="13;21;13" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.55;0;0.55" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text class="mono amb" x="150" y="243" font-size="11.5" letter-spacing="2.4" text-anchor="middle">OCT 2022</text>
    <text class="mono" fill="#9A6B12" x="150" y="225" font-size="10" letter-spacing="2" text-anchor="middle">GESTURE CAR</text>
    <text class="mono" fill="#9A6B12" x="150" y="207" font-size="9.5" letter-spacing="1.8" text-anchor="middle">BUILT FIRST</text>
    <line x1="150" y1="270" x2="205" y2="450" stroke="url(#carT)" stroke-width="2"
          stroke-dasharray="190" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="190;190;0" keyTimes="0;0.7143;1" dur="2.8s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1"/>
    </line>
    <circle cx="205" cy="450" r="4" fill="#E8621F" opacity="1">
    </circle>
  </g>

  <!-- ── the silence ──────────────────────────────────────── -->
  <use href="#silence" fill="none" stroke="url(#ignite)" stroke-width="2.6" filter="url(#glowHot)"
       stroke-dasharray="880" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="880;880;0" keyTimes="0;0.5;1" dur="6.0s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1"/>
  </use>

  <circle r="4.8" fill="#B02008" filter="url(#glowHot)" opacity="0">
    <set attributeName="opacity" to="1" begin="3.0s"/>
    <set attributeName="opacity" to="0" begin="6.0s"/>
    <animateMotion dur="3.0s" begin="3.0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1">
      <mpath href="#silence"/>
    </animateMotion>
  </circle>

  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9365;1" dur="6.3s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1"/>
    <circle cx="1039" cy="450" r="6.5" class="ver" filter="url(#glowSoft)"/>
    <circle cx="1039" cy="450" r="13" fill="none" stroke="#D92B12" stroke-width="1.1" stroke-opacity="0.6">
      <animate attributeName="r" values="13;23;13" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text class="mono ver" x="1039" y="484" font-size="11.5" letter-spacing="2.4" text-anchor="middle">MAY 2026</text>
    <text class="mono" fill="#B23A1E" x="1039" y="501" font-size="9.5" letter-spacing="1.8" text-anchor="middle">THE RECORD RESUMES</text>
  </g>

  <g text-anchor="middle">
    <g class="mono ver" font-size="30" letter-spacing="5">
      <text x="638" y="360" opacity="0">00<set attributeName="opacity" to="1" begin="6.0s"/><set attributeName="opacity" to="0" begin="6.12s"/></text>
      <text x="638" y="360" opacity="0">08<set attributeName="opacity" to="1" begin="6.12s"/><set attributeName="opacity" to="0" begin="6.24s"/></text>
      <text x="638" y="360" opacity="0">16<set attributeName="opacity" to="1" begin="6.24s"/><set attributeName="opacity" to="0" begin="6.36s"/></text>
      <text x="638" y="360" opacity="0">24<set attributeName="opacity" to="1" begin="6.36s"/><set attributeName="opacity" to="0" begin="6.48s"/></text>
      <text x="638" y="360" opacity="0">32<set attributeName="opacity" to="1" begin="6.48s"/><set attributeName="opacity" to="0" begin="6.60s"/></text>
      <text x="638" y="360" opacity="1">39</text>
    </g>
    <text class="mono" fill="#B23A1E" x="638" y="333" font-size="11" letter-spacing="3.4">MONTHS WITHOUT A PUSH</text>
  </g>

  <circle r="2.8" fill="#E8621F" opacity="0">
    <animate attributeName="opacity" values="0;0;0.95;0.95;0" keyTimes="0;0.66;0.70;0.97;1"
             dur="10s" begin="0s" repeatCount="indefinite"/>
    <animateMotion dur="10s" begin="0s" repeatCount="indefinite"
                   keyPoints="0;0;1" keyTimes="0;0.66;1" calcMode="linear">
      <mpath href="#silence"/>
    </animateMotion>
  </circle>

  <line x1="48" y1="568" x2="1152" y2="568" stroke="#DDD9D0"/>
  <text class="mono" fill="#8A8E98" x="48" y="592" font-size="11" letter-spacing="2.6">THE WORK DID NOT STOP. THE RECORD DID.</text>
  <text class="mono" fill="#8A8E98" x="1152" y="592" font-size="11" letter-spacing="2.6" text-anchor="end">DISPLACEMENT MAP · 2022—2026</text>
</svg>
